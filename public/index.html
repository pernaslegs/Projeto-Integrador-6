<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biblioteca pessoal</title><link rel="stylesheet" href="/style.css"></head><body><main><header><small>CRUD • SEQUELIZE • SQLITE</small><h1>Biblioteca pessoal</h1><p>Cada livro possui ISBN único; ano de publicação e ISBN são validados.</p></header><section><h2 id="form-title">Novo livro</h2><form id="form"><label for="titulo">Título</label><input id="titulo" name="titulo" type="text" required >
<label for="autor">Autor</label><input id="autor" name="autor" type="text" required >
<label for="isbn">ISBN (13 dígitos)</label><input id="isbn" name="isbn" type="text" required >
<label for="ano">Ano de publicação</label><input id="ano" name="ano" type="number" required min="0"><div class="actions"><button id="save">Salvar</button><button id="cancel" type="button" hidden>Cancelar edição</button></div></form></section><section><h2>Livros</h2><p role="status" id="message"></p><ul id="list"></ul></section></main><script src="/app.js" defer></script></body></html>
